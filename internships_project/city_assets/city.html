<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>MarketDesk City</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a8c7a'/%3E%3Cpath d='M8 9h16v4H8zm0 7h7v8H8zm10 0h6v8h-6z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preload" href="/city/campus.svg" as="image" type="image/svg+xml" />
  <link rel="license" href="/city/PIXELFLOOR_LICENSE.txt" />
  <link rel="stylesheet" href="/city/city.css" />
</head>
<body>
  <noscript>
    <style>#root { display: none; }</style>
    <div class="boot-screen" role="status">
      <p>JavaScript est désactivé. Active-le dans ton navigateur, puis recharge cette page pour ouvrir MarketDesk City.</p>
    </div>
  </noscript>
  <div id="root"><div class="boot-screen">Ouverture de MarketDesk City…</div></div>
  <template id="city-load-error">
    <div class="boot-screen">
      <section class="boot-message" role="alert" aria-labelledby="city-load-error-title">
        <h1 id="city-load-error-title">City n’a pas pu charger son interface</h1>
        <p>Vérifie ta connexion, puis réessaie.</p>
        <button type="button" onclick="window.location.reload()">Recharger City</button>
      </section>
    </div>
  </template>
  <script defer src="/city/city.js" onerror="document.getElementById('root').replaceChildren(document.getElementById('city-load-error').content.cloneNode(true))"></script>
</body>
</html>
